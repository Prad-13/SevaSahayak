<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seva Sahayak</title>
<meta name="description" content="College design prototype: check government scheme eligibility and get application-ready. Not an official app.">
<style>
/* Seva Sahayak: mobile-first, high contrast, no external fonts or images. */
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --ink: #0f172a;
  --muted: #475569;
  --brand: #1e3a8a;
  --brand-2: #1d4ed8;
  --brand-ink: #ffffff;
  --brand-soft: #e8eefc;
  --line: #cbd5e1;
  --line-strong: #64748b;
  --ok: #14532d;
  --ok-bg: #dcfce7;
  --ok-line: #16a34a;
  --warn: #713f12;
  --warn-bg: #fef3c7;
  --warn-line: #d97706;
  --bad: #7f1d1d;
  --bad-bg: #fee2e2;
  --bad-line: #dc2626;
  --focus: #f59e0b;
  --radius: 16px;
  --radius-sm: 12px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 14px rgba(15, 23, 42, .06);
}
* { box-sizing: border-box; }
html { font-size: 100%; -webkit-text-size-adjust: 100%; }
html[data-size="1"] { font-size: 120%; }
html[data-size="2"] { font-size: 140%; }
html[data-size="3"] { font-size: 170%; }
/* Largest size doubles as a simplified layout: one column, taller buttons, fewer distractions. */
html[data-size="3"] .tiles { grid-template-columns: 1fr; }
html[data-size="3"] .tile, html[data-size="3"] .tile.wide { flex-direction: row; justify-content: flex-start; min-height: 5rem; padding: .75rem 1rem; text-align: start; }
html[data-size="3"] .answers.yn { grid-template-columns: 1fr; }
html[data-size="3"] button, html[data-size="3"] .btn { min-height: 64px; }
html[data-size="3"] .steps li:not([aria-current="step"]) .lbl { display: none; }
html[data-size="3"] .steps li[aria-current="step"] { flex: 4 1 0; }
html[data-size="3"] main, html[data-size="3"] .top > * { max-width: 40rem; }
html[data-size="3"] .disclaimer, html[data-size="3"] .hint { font-size: .85rem; }
html[data-size="3"] body { line-height: 1.6; }
html[data-size="3"] .brand { font-size: 1.1rem; }
html[data-size="3"] .lang { display: flex; width: 100%; }
html[data-size="3"] .lang button { flex: 1 1 0; min-width: 0; padding: 0 .25rem; font-size: .8rem; }
html[data-size="3"] .steps li:not([aria-current="step"]) .num { display: none; }
html[data-size="3"] .steps li:not([aria-current="step"]) { flex: 1 1 0; }
html[data-size="3"] .steps { overflow: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "Nirmala UI", "Noto Sans Telugu", "Noto Sans Devanagari", Mangal, Roboto, Arial, sans-serif;
  line-height: 1.55; padding-bottom: 3rem;
}
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5rem; letter-spacing: -.005em; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.1rem; }
p { margin: 0 0 .75rem; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) {
  main > * { animation: rise .25s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}

.skip { position: absolute; left: -999px; top: 0; background: var(--brand); color: var(--brand-ink); padding: .75rem 1rem; z-index: 50; border-radius: 0 0 var(--radius-sm) 0; }
.skip:focus { left: 0; }

/* ---------- header ---------- */
.top { background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); padding: .75rem 1rem .6rem; }
.top > * { max-width: 46rem; margin-left: auto; margin-right: auto; }
.top-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .6rem; }
.brand { font-size: 1.35rem; color: var(--brand); margin: 0; display: flex; align-items: center; gap: .5rem; }
.brand::before { content: "S"; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 1.1rem; width: 2.1rem; height: 2.1rem; border-radius: 10px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); }

/* language: segmented control */
.lang { display: inline-flex; padding: 3px; background: var(--brand-soft); border-radius: 999px; gap: 2px; }
.lang button { min-height: 48px; min-width: 48px; padding: 0 .9rem; border: 0; border-radius: 999px; background: transparent; color: var(--brand); font-weight: 700; }
.lang button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.lang button:hover { background: rgba(30, 58, 138, .1); }
.lang button[aria-pressed="true"]:hover { background: var(--brand); }

/* tools: small chip buttons */
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin-top: .6rem; }
.tools button { min-height: 48px; padding: 0 .85rem; font-size: .88rem; border-radius: 999px; border-width: 1.5px; font-weight: 600; }
.tools button[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); }
.tools button[aria-pressed="true"]::before { content: "\2713"; font-weight: 800; }
.tools button.primary { background: var(--brand); color: var(--brand-ink); }
.tools .more { flex-basis: 100%; margin: 0; }
.tools .more > summary { min-height: 48px; width: fit-content; padding: 0 .85rem; border-radius: 999px; border: 1.5px dashed var(--line-strong); background: transparent; font-size: .88rem; }
.tools .more[open] > summary { margin-bottom: .4rem; }
.more-body { display: flex; flex-wrap: wrap; gap: .4rem; }
.tools .hint { margin: 0; font-size: .85rem; }

.disclaimer { font-size: .8rem; color: var(--muted); margin: .6rem auto 0; padding: .45rem .7rem; background: var(--warn-bg); border-inline-start: 4px solid var(--warn-line); border-radius: 8px; }

/* stepper */
.steps { display: flex; gap: .3rem; list-style: none; padding: 0; margin: .75rem auto 0; counter-reset: s; overflow-x: auto; }
.steps li { display: flex; align-items: center; gap: .35rem; flex: 1 1 0; min-width: 0; font-size: .78rem; color: var(--muted); position: relative; padding-top: .55rem; }
.steps li::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px; border-radius: 4px; background: var(--line); }
.steps li.done::before { background: var(--ok-line); }
.steps li[aria-current="step"]::before { background: var(--brand-2); }
.steps .num { flex: none; width: 1.35rem; height: 1.35rem; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 800; background: var(--line); color: var(--ink); }
.steps li.done .num { background: var(--ok-line); color: #fff; }
.steps li[aria-current="step"] { color: var(--brand); font-weight: 700; }
.steps li[aria-current="step"] .num { background: var(--brand-2); color: #fff; }
.steps .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 559px) { .steps li:not([aria-current="step"]) .lbl { display: none; } .steps li[aria-current="step"] { flex: 3 1 0; } }

/* ---------- buttons ---------- */
button, .btn, input, select, textarea { font: inherit; }
button, .btn {
  min-height: 48px; min-width: 48px; padding: .6rem 1.1rem; border-radius: var(--radius-sm);
  border: 2px solid var(--brand); background: var(--surface); color: var(--brand);
  cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
  font-weight: 700; text-align: center; transition: background .15s, box-shadow .15s, transform .05s;
}
button:hover, .btn:hover { background: var(--brand-soft); }
button:active, .btn:active { transform: translateY(1px); }
button.primary, .btn.primary { background: var(--brand); color: var(--brand-ink); box-shadow: 0 2px 6px rgba(30, 58, 138, .3); }
button.primary:hover, .btn.primary:hover { background: #172e6e; }
button.ghost { border-color: var(--line-strong); color: var(--ink); background: transparent; font-weight: 600; }
button.ghost:hover { background: #e2e8f0; }
button.danger { border-color: var(--bad-line); color: var(--bad); }
button.danger:hover { background: var(--bad-bg); }
button:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1.1rem 0; }
.row > .primary { flex: 1 1 14rem; }

main { padding: 1.25rem 1rem; max-width: 46rem; margin: 0 auto; outline: none; }
main h2:focus { outline: none; }
.lead { font-size: 1.05rem; color: var(--muted); margin-bottom: 1.1rem; }

/* ---------- start tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem; margin: 1rem 0 1.25rem; }
.tile { flex-direction: column; min-height: 7rem; font-size: 1.05rem; padding: .9rem .5rem; background: var(--surface); border: 1.5px solid var(--line); color: var(--ink); box-shadow: var(--shadow); border-radius: var(--radius); }
.tile:hover { border-color: var(--brand-2); background: var(--surface); box-shadow: 0 0 0 3px var(--brand-soft), var(--shadow); }
.tile .icon { font-size: 1.7rem; line-height: 1; width: 3.2rem; height: 3.2rem; display: grid; place-items: center; border-radius: 50%; background: var(--brand-soft); }
.tile.wide { grid-column: 1 / -1; min-height: 4.5rem; flex-direction: row; background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.tile.wide:hover { background: #172e6e; }
.tile.wide .icon { background: rgba(255, 255, 255, .2); width: 2.6rem; height: 2.6rem; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-inline-start: 6px solid var(--line-strong); border-radius: var(--radius); padding: 1rem 1.1rem; margin: .9rem 0; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; gap: .7rem; margin-bottom: .35rem; }
.card-head h3 { margin: 0; }
.ico { width: 2.4rem; height: 2.4rem; flex: none; padding: .45rem; border-radius: 12px; background: var(--brand-soft); color: var(--brand); fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.card h3 { margin-bottom: .35rem; font-size: 1.12rem; }
.card:has(.badge.ELIGIBLE) { border-inline-start-color: var(--ok-line); }
.card:has(.badge.NEEDS_A_QUICK_CHECK) { border-inline-start-color: var(--warn-line); }
.card:has(.badge.NOT_ELIGIBLE) { border-inline-start-color: var(--bad-line); }
.badge { display: inline-flex; align-items: center; gap: .35rem; padding: .2rem .7rem; border-radius: 999px; font-weight: 700; font-size: .9rem; border: 1.5px solid; }
.badge.ELIGIBLE, .badge.ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-line); }
.badge.NEEDS_A_QUICK_CHECK, .badge.warning { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
.badge.NOT_ELIGIBLE, .badge.fail { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-line); }

.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0 1rem; }
.chip { padding: .3rem .8rem; border-radius: 999px; font-size: .9rem; border: 1.5px solid; }
.chip strong { font-size: 1.05rem; }
.chip.ELIGIBLE { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-line); }
.chip.NEEDS_A_QUICK_CHECK { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
.chip.NOT_ELIGIBLE { color: var(--bad); background: var(--bad-bg); border-color: var(--bad-line); }

.why { list-style: none; padding: .6rem .75rem; margin: .5rem 0 0; font-size: .93rem; background: var(--bg); border-radius: var(--radius-sm); }
.why li { padding-inline-start: 1.6rem; position: relative; margin-bottom: .3rem; }
.why li:last-child { margin-bottom: 0; }
.why li::before { position: absolute; inset-inline-start: 0; font-weight: 800; }
.why li.ok::before { content: "\2713"; color: var(--ok-line); }
.why li.no::before { content: "\2717"; color: var(--bad-line); }
.why li.unk::before { content: "?"; color: var(--warn-line); }
details { margin: .9rem 0; }
details > summary { min-height: 48px; display: flex; align-items: center; cursor: pointer; font-weight: 700; padding: .25rem .9rem; background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); color: var(--muted); }
details[open] > summary { margin-bottom: .5rem; }

/* ---------- questions ---------- */
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.25rem 1.1rem; }
.qcard h2 { margin-bottom: 1rem; }
.qnum { display: inline-block; font-size: .85rem; font-weight: 800; color: var(--brand); background: var(--brand-soft); padding: .2rem .75rem; border-radius: 999px; margin-bottom: .6rem; }
.qtext { display: block; font-size: 1.35rem; font-weight: 700; line-height: 1.35; }
.answers { display: grid; gap: .6rem; margin: 1rem 0 .5rem; }
.answers.yn { grid-template-columns: 1fr 1fr; }
.answers .unk { grid-column: 1 / -1; }
.answers button { min-height: 56px; font-size: 1.1rem; }
.answers.yn .primary:first-child { background: #166534; border-color: #166534; box-shadow: none; }
.answers.yn .primary:nth-child(2) { background: #991b1b; border-color: #991b1b; box-shadow: none; }

label { display: block; font-weight: 700; margin-bottom: .3rem; }
input[type="text"], input[type="number"] {
  width: 100%; min-height: 52px; padding: .55rem .85rem; border: 2px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); font-size: 1.1rem;
}
input:focus { border-color: var(--brand-2); outline: 3px solid var(--brand-soft); outline-offset: 0; }
input[aria-invalid="true"] { border-color: var(--bad-line); }
.field { margin: .85rem 0; }
.error { color: var(--bad); font-weight: 700; margin: .35rem 0 0; }
.error:empty { display: none; }
.hint { color: var(--muted); font-size: .93rem; }

.notice { border: 1px solid var(--brand-2); background: var(--brand-soft); border-radius: var(--radius); padding: .9rem 1rem; margin: 1.25rem 0; }
.notice h3 { margin-bottom: .25rem; color: var(--brand); }
.notice p:last-child, .notice ul:last-child { margin-bottom: 0; }
.banner { background: var(--warn-bg); color: var(--warn); border-bottom: 3px solid var(--warn-line); padding: .75rem 1rem; font-weight: 700; display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; justify-content: center; position: sticky; top: 0; z-index: 30; }
.toast { position: fixed; left: 50%; bottom: 1rem; transform: translateX(-50%); background: var(--ink); color: #fff; padding: .7rem 1.1rem; border-radius: 999px; max-width: 92vw; z-index: 40; display: none; box-shadow: var(--shadow); }
.toast.show { display: block; }

/* ---------- documents ---------- */
.progress { width: 100%; height: .8rem; appearance: none; -webkit-appearance: none; border: 0; border-radius: 999px; overflow: hidden; background: var(--line); }
.progress::-webkit-progress-bar { background: var(--line); }
.progress::-webkit-progress-value { background: var(--ok-line); border-radius: 999px; transition: width .25s; }
.progress::-moz-progress-bar { background: var(--ok-line); border-radius: 999px; }
#doc-progress-label { font-weight: 800; color: var(--ink); margin: .5rem 0 .35rem; }
.docrow .row { margin: .6rem 0 0; gap: .5rem; }
.docrow .row button { flex: 1 1 8rem; }
.docrow button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }
.docrow button[id$="-miss"][aria-pressed="true"] { background: var(--warn); border-color: var(--warn); }
.guide { background: var(--warn-bg); border-inline-start: 5px solid var(--warn-line); padding: .6rem .8rem; margin-top: .75rem; border-radius: 8px; font-size: .93rem; }

/* ---------- summary ---------- */
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem; box-shadow: var(--shadow); }
.summary section { margin-bottom: 1.1rem; padding-bottom: .9rem; border-bottom: 1px solid var(--line); }
.summary h3 { color: var(--brand); font-size: 1rem; text-transform: uppercase; letter-spacing: .04em; }
.summary ul { margin: .25rem 0; padding-inline-start: 1.2rem; }
.summary li { margin-bottom: .2rem; }
.official { border: 2px solid var(--brand); padding: .8rem 1rem; border-radius: var(--radius-sm); font-weight: 800; background: var(--brand-soft); color: var(--brand); margin: 0; }

/* ---------- metrics ---------- */
.metrics { max-width: 46rem; margin: 1rem auto; padding: 1rem; border: 2px dashed var(--brand-2); border-radius: var(--radius); background: var(--surface); }
.metrics h2 { font-size: 1.1rem; color: var(--brand); }
.metrics dl { display: grid; grid-template-columns: 1fr auto; gap: .5rem 1rem; margin: .5rem 0; }
.metrics dt { color: var(--muted); font-size: .93rem; }
.metrics dd { margin: 0; font-weight: 800; text-align: end; font-variant-numeric: tabular-nums; }
@media (max-width: 859px) { .metrics { margin-inline: 1rem; } }

@media (min-width: 600px) {
  .tiles { grid-template-columns: repeat(3, 1fr); }
  .tile.wide { grid-column: auto; min-height: 7rem; flex-direction: column; }
  .qcard { padding: 1.75rem; }
}

@media print {
  .top, .banner, .toast, .metrics, .noprint, .skip { display: none !important; }
  body { padding: 0; background: #fff; }
  main { max-width: none; padding: 0; }
  .card, .summary { box-shadow: none; break-inside: avoid; }
  main > * { animation: none; }
}

</style>
</head>
<body>
<a class="skip" id="skip" href="#main">Skip to main content</a>

<header class="top" id="top">
  <div class="top-row">
    <h1 class="brand" id="brand">Seva Sahayak</h1>
    <div class="lang" id="langs" role="group"></div>
  </div>
  <div class="tools" id="tools"></div>
  <p class="disclaimer" id="disclaimer" role="note"></p>
  <ol class="steps" id="steps"></ol>
</header>

<div class="banner" id="idle-banner" role="alert" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<main id="main" tabindex="-1"></main>

<aside id="metrics" class="metrics" hidden></aside>

<noscript><p class="noscript">This app needs JavaScript to run.</p></noscript>

<script>
/*
 * Compatibility helpers for older phones (for example Android 9 with an old Chrome or WebView):
 * small polyfills, and a visible message if the app fails to start (instead of a blank page).
 */
(function () {
  "use strict";

  if (!Element.prototype.replaceChildren) {
    Element.prototype.replaceChildren = function () {
      while (this.firstChild) this.removeChild(this.firstChild);
      for (var i = 0; i < arguments.length; i++) {
        var n = arguments[i];
        this.appendChild(typeof n === "string" ? document.createTextNode(n) : n);
      }
    };
  }
  if (!Array.prototype.flat) {
    Array.prototype.flat = function (depth) {
      var out = [];
      (function walk(a, d) {
        a.forEach(function (x) {
          if (Array.isArray(x) && d > 0) walk(x, d - 1); else out.push(x);
        });
      })(this, depth === undefined ? 1 : depth);
      return out;
    };
  }

  function show(msg) {
    var box = document.getElementById("boot-error");
    if (!box) {
      box = document.createElement("div");
      box.id = "boot-error";
      box.setAttribute("role", "alert");
      box.style.cssText = "margin:12px;padding:12px;border:3px solid #7f1d1d;background:#fee2e2;color:#7f1d1d;font:16px/1.4 sans-serif;";
      var main = document.getElementById("main");
      if (main && main.parentNode) main.parentNode.insertBefore(box, main); else document.body.appendChild(box);
    }
    var p = document.createElement("p");
    p.style.margin = "0 0 6px";
    p.textContent = msg;
    box.appendChild(p);
  }

  window.addEventListener("error", function (e) {
    show("Problem: " + (e.message || "script error") + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : ""));
  });

  window.addEventListener("load", function () {
    setTimeout(function () {
      var main = document.getElementById("main");
      if (main && !main.firstChild && !document.getElementById("boot-error")) {
        show("The app could not start. Please update Chrome, or open the single-file version (seva-sahayak-single.html).");
      }
    }, 800);
  });
})();

</script>

  function t(key, params) {

    if (s === undefined) return key;
    return params ? s.replace(/\{(\w+)\}/g, function (m, k) { return k in params ? params[k] : m; }) : s;
  }

  /* Pick the current language from a {en,te,hi} object, falling back to English. */
  function pick(obj) { return obj[lang] || obj.en; }

  function setLang(code) {
    lang = code;
    document.documentElement.lang = code;
  }

  function speechLang() {
    for (var i = 0; i < LANGS.length; i++) if (LANGS[i].code === lang) return LANGS[i].speech;

  }

 * Eligibility engine. Three-valued logic (true / false / null = unknown).
 * Runs in the browser (global SSEngine) and under Node (module.exports).
 * Answers: { attr: value } where value === "?" means "I don't know" and a missing key means unanswered.

  function hasValue(answers, attr) {

    return out;
  }

  function unresolvedAttrs(c, answers) {
    if (evalCond(c, answers) !== null) return [];
    if (c.op === "or") {
      var out = [];
      c.conds.forEach(function (s) {
        unresolvedAttrs(s, answers).forEach(function (a) { if (out.indexOf(a) < 0) out.push(a); });
      });

    UNKNOWN: UNKNOWN, ELIGIBLE: ELIGIBLE, NOT_ELIGIBLE: NOT_ELIGIBLE, UNDECIDED: UNDECIDED, NEEDS_A_QUICK_CHECK: NEEDS,

  const E = SSEngine, M = SSMismatch, I = SSI18n, t = I.t;
  const NAME_KEYS = ["aadhaar", "bank", "land"];
  const STEP_OF = { start: 0, question: 1, results: 2, docs: 3, names: 4, summary: 5 };
  const STEP_KEYS = ["nav.start", "nav.questions", "nav.results", "nav.docs", "nav.names", "nav.summary"];

  /* Preferences that survive "Clear my details" (they hold no personal data). */
  const ui = { size: 0, helper: false, helped: 0, metricsOn: false, voiceOn: false, voiceNotice: false };

  /* Auto-wipe after inactivity. ?idle=<seconds> shortens it for demos and testing. */
  const idleParam = Number(new URLSearchParams(location.search).get("idle"));
  const IDLE_MS = (idleParam > 0 ? idleParam : 300) * 1000;
  const WARN_MS = Math.min(30000, IDLE_MS / 2);

  function fresh() {
    return {
      screen: "start", tile: null, cands: [], answers: {}, asked: [],
      docs: {}, names: { aadhaar: "", bank: "", land: "" }, nameResult: null, copyMsg: ""
    };
  }
  let s = fresh();

  const $ = (id) => document.getElementById(id);

  /* ---------- tiny DOM helper (text is always set as text, never as HTML) ---------- */
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    kids.flat().forEach((c) => {
      if (c == null || c === false) return;
      el.append(c.nodeType ? c : document.createTextNode(c));
    });
    return el;
  }

  /* ---------- label helpers ---------- */
  const Q = SS_QUESTIONS;

  function attrLabel(attr) { return I.pick(Q[attr].label); }

  function answerText(attr, v) {
    if (v === undefined) return "—";
    if (v === E.UNKNOWN) return t("answer.unknown");
    if (v === true) return t("answer.yes");
    if (v === false) return t("answer.no");
    const q = Q[attr];
    if (q.options) {
      const o = q.options.find((x) => x.value === v);
      if (o) return I.pick(o.label);
    }
    return String(v);
  }

  function needText(c) {
    if (c.op === "eq") {
      if (c.value === true) return t("need.yes");
      if (c.value === false) return t("need.no");
      const o = (Q[c.attr].options || []).find((x) => x.value === c.value);
      return o ? I.pick(o.label) : String(c.value);
    }
    return t(c.op === "gte" ? "need.gte" : "need.lte", { n: c.value });
  }

  function condLabel(c) { return c.op === "or" ? c.conds.map((x) => attrLabel(x.attr)).join(" / ") : attrLabel(c.attr); }
  function condAnswer(c) {
    if (c.op === "or") return c.conds.map((x) => answerText(x.attr, s.answers[x.attr])).join(", ");
    return answerText(c.attr, s.answers[c.attr]);
  }
  function condNeed(c) {
    if (c.op === "or") return c.conds.map((x) => "(" + attrLabel(x.attr) + ": " + needText(x) + ")").join(" " + t("or") + " ");
    return needText(c);
  }

  /* Plain-language "why" lines built from the user's own answers. */
  function whyLines(scheme, status) {
    const lines = [];
    E.explain(scheme, s.answers).forEach((it) => {
      // an OR that is satisfied is explained by the alternative that satisfied it
      const c = it.cond.op === "or" && it.result === true ? it.cond.conds.find((x) => E.evalCond(x, s.answers) === true) : it.cond;
      const p = { label: condLabel(c), answer: condAnswer(c), need: condNeed(c) };
      let cls, text;
      if (it.kind === "required") {
        if (it.result === true) { cls = "ok"; text = t("why.met", p); }
        else if (it.result === false) { cls = "no"; text = t("why.failed", p); }
        else { cls = "unk"; text = t("why.unknown", p); }
      } else {
        if (it.result === true) { cls = "no"; text = t("why.exclTriggered", p); }
        else if (it.result === false) { cls = "ok"; text = t("why.met", p); }
        else { cls = "unk"; text = t("why.exclUnknown", p); }
      }
      // A rejected scheme only needs the reasons it was rejected.
      if (status === E.NOT_ELIGIBLE && cls !== "no") return;
      // e.g. "age at least 40" and "age at most 79" both read "Age: 54"; show it once
      if (lines.some((l) => l.text === text)) return;
      lines.push({ cls, text });
    });
    return lines;
  }

  /* ---------- chrome (header, language buttons, tools, steps) ---------- */
  let chromeBuilt = false;
  function updateChrome() {
    $("skip").textContent = t("skip");
    $("brand").textContent = t("app.title");
    $("disclaimer").textContent = t("disclaimer");
    document.title = t("app.title");
    document.documentElement.setAttribute("data-size", String(ui.size));

    const langs = $("langs");
    langs.setAttribute("aria-label", t("lang.label"));
    if (!chromeBuilt) {
      I.LANGS.forEach((l) => {
        langs.append(h("button", { type: "button", id: "lang-" + l.code, lang: l.code, onclick: () => { I.setLang(l.code); render(false, "lang-" + l.code); } }, l.label));
      });
      const tools = $("tools");
      tools.append(
        h("button", { type: "button", id: "size-btn", class: "small", onclick: () => { ui.size = (ui.size + 1) % 4; render(false, "size-btn"); } }),
        h("button", { type: "button", id: "next-btn", class: "small primary", onclick: nextPerson }),
        h("span", { id: "helper-count", class: "hint", role: "status" }),
        h("button", { type: "button", id: "clear-btn", class: "small danger", onclick: () => wipe(t("clear.done")) }),
        h("details", { id: "more", class: "more" },
          h("summary", { id: "more-sum" }),
          h("div", { class: "more-body" },
            h("button", { type: "button", id: "helper-btn", class: "small", onclick: () => { ui.helper = !ui.helper; render(false, "helper-btn"); } }),
            h("button", { type: "button", id: "metrics-btn", class: "small", onclick: () => { ui.metricsOn = !ui.metricsOn; render(false, "metrics-btn"); } }),
            h("button", { type: "button", id: "voice-btn", class: "small", onclick: toggleVoice })))
      );
      chromeBuilt = true;
    }
    $("more-sum").textContent = "⋯ " + t("more");
    $("helper-btn").textContent = t("helper.toggle");
    $("helper-btn").setAttribute("aria-pressed", String(ui.helper));
    $("next-btn").textContent = t("helper.next");
    $("next-btn").hidden = !ui.helper;
    $("helper-count").textContent = t("helper.count", { n: ui.helped });
    $("helper-count").hidden = !ui.helper;
    $("metrics-btn").textContent = t("metrics.toggle");
    $("metrics-btn").setAttribute("aria-pressed", String(ui.metricsOn));
    $("voice-btn").textContent = ui.voiceOn ? t("voice.off") : t("voice.toggle");
    $("voice-btn").setAttribute("aria-pressed", String(ui.voiceOn));
    $("voice-btn").hidden = !(SSVoice.recognitionSupported() || SSVoice.speechSupported());
    I.LANGS.forEach((l) => $("lang-" + l.code).setAttribute("aria-pressed", String(l.code === I.getLang())));
    $("size-btn").textContent = "A" + "+".repeat(Math.min(ui.size + 1, 3));
    $("size-btn").setAttribute("aria-label", t("size.label") + ". " + t("size." + ui.size));
    $("clear-btn").textContent = t("clear");

    const cur = STEP_OF[s.screen];
    const steps = $("steps");
    steps.replaceChildren(...STEP_KEYS.map((k, i) => h("li", { "aria-current": i === cur ? "step" : null, class: i < cur ? "done" : null }, h("span", { class: "num", "aria-hidden": "true", text: String(i + 1) }), h("span", { class: "lbl", text: t(k) }))));
  }

  let toastTimer = null;
  function showToast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 4000);
  }

  /* ---------- navigation / render ---------- */
  function go(screen) { s.screen = screen; render(true); }

  function render(focusHeading, focusId) {
    // no question left to ask means the results screen, so the step indicator must say so too
    if (s.screen === "question" && E.nextAttribute(s.cands, s.answers) === null) s.screen = "results";
    updateChrome();
    const main = $("main");
    main.replaceChildren();
    const screens = { start: renderStart, question: renderQuestion, results: renderResults, docs: renderDocs, names: renderNames, summary: renderSummary };
    const heading = screens[s.screen](main);
    if (ui.voiceNotice) main.prepend(voiceNoticeBox());
    renderMetrics();
    if (ui.voiceOn && s.screen === "question") speakQuestion();
    if (focusId && $(focusId)) $(focusId).focus({ preventScroll: true });
    else if (focusHeading && heading) {
      heading.setAttribute("tabindex", "-1");
      heading.focus({ preventScroll: true });
      window.scrollTo(0, 0);
    }
  }

  function wipe(message) {
    SSVoice.stop();
    SSMetrics.reset();
    s = fresh();
    ui.voiceNotice = false;
    hideIdleBanner();
    render(true);
    if (message) showToast(message);
  }

  /* ---------- 8. helper mode ---------- */
  function nextPerson() {
    if (s.asked.length > 0) ui.helped++; // a number only, no data kept
    wipe();
  }

  /* ---------- 9. inactivity wipe ---------- */
  let warnTimer = null, wipeTimer = null, countTimer = null;

  function hasData() {
    return s.screen !== "start" || s.asked.length > 0 || Object.keys(s.docs).length > 0 || NAME_KEYS.some((k) => s.names[k]);
  }

  function hideIdleBanner() {
    clearInterval(countTimer);
    $("idle-banner").hidden = true;
  }

  function showIdleWarning() {
    if (!hasData()) return;
    let left = Math.round(WARN_MS / 1000);
    const banner = $("idle-banner");
    const msg = h("span", { text: t("idle.warn", { s: left }) });
    banner.replaceChildren(msg, h("button", { type: "button", class: "primary", onclick: resetIdle }, t("idle.keep")));
    banner.hidden = false;
    clearInterval(countTimer);
    countTimer = setInterval(() => { left = Math.max(0, left - 1); msg.textContent = t("idle.warn", { s: left }); }, 1000);
  }

  function resetIdle() {
    hideIdleBanner();
    clearTimeout(warnTimer);
    clearTimeout(wipeTimer);
    warnTimer = setTimeout(showIdleWarning, IDLE_MS - WARN_MS);
    wipeTimer = setTimeout(() => { if (hasData()) wipe(t("idle.wiped")); else resetIdle(); }, IDLE_MS);
  }

  ["pointerdown", "keydown", "input", "touchstart"].forEach((ev) => document.addEventListener(ev, () => {
    if (!$("idle-banner").hidden) return; // once warned, only the "Keep my details" button keeps them
    resetIdle();
  }, true));

  /* ---------- 10. demo metrics ---------- */
  function renderMetrics() {
    const box = $("metrics");
    box.hidden = !ui.metricsOn;
    if (!ui.metricsOn) return;
    const asked = s.asked.length;
    const fixed = s.cands.length ? E.fixedFormLength(s.cands) : 0;
    const ms = SSMetrics.resultMs();
    const fixedAll = E.fixedFormLength(SS_SCHEMES);
    const row = (k, v) => [h("dt", { text: k }), h("dd", { text: v })];
    box.replaceChildren(
      h("h2", { text: t("metrics.title") }),
      h("dl", null,
        row(t("metrics.questions"), String(asked)),
        row(t("metrics.fixed"), s.cands.length ? fixed + " (" + t("metrics.fixedAll") + ": " + fixedAll + ")" : "—"),
        row(t("metrics.saved"), s.cands.length ? String(fixed - asked) : "—"),
        row(t("metrics.time"), ms === null ? t("metrics.na") : (ms / 1000).toFixed(1) + " s"),
        row(t("metrics.size"), SSMetrics.ruleDataKB().toFixed(1) + " KB"),
        row(t("metrics.net"), String(SSMetrics.networkRequests()))),
      h("p", { class: "hint", text: t("metrics.note") }));
  }

  /* ---------- 11. voice (optional, off by default) ---------- */
  function voiceNoticeBox() {
    return h("section", { class: "notice", role: "alertdialog", "aria-labelledby": "vn-h" },
      h("h3", { id: "vn-h", text: t("voice.toggle") }),
      h("p", { text: t("voice.notice") }),
      h("div", { class: "row" },
        h("button", { type: "button", class: "primary", id: "vn-ok", onclick: enableVoice }, t("voice.enable")),
        h("button", { type: "button", onclick: () => { ui.voiceNotice = false; render(false, "voice-btn"); } }, t("voice.cancel"))));
  }

  function toggleVoice() {
    if (ui.voiceOn) { ui.voiceOn = false; SSVoice.stop(); render(false, "voice-btn"); return; }
    ui.voiceNotice = true;
    render(false, "vn-ok");
  }

  function enableVoice() {
    ui.voiceOn = true;
    ui.voiceNotice = false;
    render(false, "voice-btn");
    if (s.screen === "start") SSVoice.speak(t("start.intro"), I.speechLang());
  }

  function speakQuestion() {
    const el = $("qtext");
    if (el) SSVoice.speak(el.textContent, I.speechLang());
  }

  function listenForAnswer(attr) {
    const status = $("voice-status");
    status.textContent = t("voice.listening");
    SSVoice.listen(I.speechLang(), (alts) => {
      let value = null, heard = alts[0];
      for (const a of alts) {
        const v = SSVoice.parseAnswer(Q[attr], a);
        if (v !== null) { value = v; heard = a; break; }
      }
      if (value === null) { status.textContent = t("voice.heard", { t: heard }) + " " + t("voice.unclear"); return; }
      showToast(t("voice.heard", { t: heard }));
      answer(attr, value);
    }, () => { status.textContent = t("voice.error"); }, () => {
      if (status.textContent === t("voice.listening")) status.textContent = "";
    });
  }

  function voiceControls(attr) {
    if (!ui.voiceOn) return null;
    return h("div", { class: "row noprint" },
      SSVoice.recognitionSupported() ? h("button", { type: "button", id: "mic-btn", onclick: () => listenForAnswer(attr) }, "🎤 " + t("voice.mic")) : null,
      SSVoice.speechSupported() ? h("button", { type: "button", onclick: speakQuestion }, "🔊 " + t("voice.read")) : null,
      h("p", { id: "voice-status", class: "hint", role: "status", "aria-live": "polite" }));
  }

  /* ---------- 1. start ---------- */
  function renderStart(main) {
    main.append(h("p", { class: "lead", text: t("app.tagline") }));
    const heading = h("h2", { text: t("start.heading") });
    main.append(heading, h("p", { class: "hint", text: t("start.sub") }));
    main.append(h("div", { class: "tiles" }, SS_TILES.map((tile) =>
      h("button", { type: "button", class: "tile" + (tile.id === "all" ? " wide" : ""), onclick: () => startWith(tile) },
        h("span", { class: "icon", "aria-hidden": "true", text: tile.icon }),
        h("span", { text: I.pick(tile.label) })))));
    {
      const tts = SSVoice.speechSupported(), stt = SSVoice.recognitionSupported();
      const vbox = h("section", { class: "notice", "aria-labelledby": "vbox-h" }, h("h3", { id: "vbox-h", text: "\uD83C\uDFA4 " + t("voice.toggle") }));
      if (tts || stt) {
        vbox.append(h("p", { class: "hint", text: t("voice.status", { tts: tts ? t("voice.yes") : t("voice.no"), stt: stt ? t("voice.yes") : t("voice.no") }) }));
        if (stt && window.isSecureContext === false) vbox.append(h("p", { class: "hint", text: t("voice.secure") }));
        vbox.append(h("div", { class: "row" },
          h("button", { type: "button", id: "speak-btn", onclick: () => { if (ui.voiceOn) SSVoice.speak(t("start.intro"), I.speechLang()); else toggleVoice(); } },
            "\uD83C\uDFA4 " + t("start.speak"))));
      } else {
        vbox.append(h("p", { class: "hint", text: t("voice.none") }));
      }
      main.append(vbox);
    }
    main.append(h("section", { class: "notice", "aria-labelledby": "priv-h" },
      h("h3", { id: "priv-h", text: t("privacy.title") }),
      h("p", { text: t("privacy.body") })));
    return heading;
  }

  function startWith(tile) {
    s.tile = tile.id;
    s.cands = E.candidates(SS_SCHEMES, tile.tag);
    s.answers = {};
    s.asked = [];
    SSMetrics.begin();
    go("question");
  }

  /* ---------- 3. adaptive questions ---------- */
  function renderQuestion(main) {
    const attr = E.nextAttribute(s.cands, s.answers);
    if (attr === null) { s.screen = "results"; return renderResults(main); }
    const q = Q[attr];
    const box = h("section", { class: "qcard" });
    main.append(box);
    const heading = h("h2", null,
      h("span", { class: "qnum", text: t("q.number", { n: s.asked.length + 1 }) }),
      h("span", { class: "qtext", id: "qtext", text: I.pick(q.text) }));
    box.append(heading);

    const dontKnow = h("button", { type: "button", class: "ghost unk", id: "ans-unknown", onclick: () => answer(attr, E.UNKNOWN) }, "? " + t("q.dontknow"));
    if (q.type === "yesno") {
      box.append(h("div", { class: "answers yn" },
        h("button", { type: "button", class: "primary", id: "ans-yes", onclick: () => answer(attr, true) }, "✓ " + t("q.yes")),
        h("button", { type: "button", class: "primary", id: "ans-no", onclick: () => answer(attr, false) }, "✗ " + t("q.no")),
        dontKnow));
    } else if (q.type === "choice") {
      box.append(h("div", { class: "answers" },
        q.options.map((o) => h("button", { type: "button", class: "primary", id: "ans-" + o.value, onclick: () => answer(attr, o.value) }, I.pick(o.label))),
        dontKnow));
    } else {
      const err = h("p", { class: "error", id: "q-err", role: "alert" });
      const input = h("input", { type: "number", inputmode: "numeric", id: "q-input", min: q.min, max: q.max, step: "1", "aria-describedby": "q-err", autocomplete: "off" });
      const form = h("form", { novalidate: true, onsubmit: (ev) => {
        ev.preventDefault();
        const raw = input.value.trim();
        const n = Number(raw);
        if (raw === "" || !Number.isInteger(n) || n < q.min || n > q.max) {
          err.textContent = t("q.error", { min: q.min, max: q.max });
          input.setAttribute("aria-invalid", "true");
          input.focus();
          return;
        }
        answer(attr, n);
      } },
        h("div", { class: "field" }, h("label", { for: "q-input", text: t("q.numberLabel") }), input, err),
        h("div", { class: "row" }, h("button", { type: "submit", class: "primary" }, t("q.next")), dontKnow));
      box.append(form);
    }
    const vc = voiceControls(attr);
    if (vc) box.append(vc);
    box.append(h("p", { class: "hint", text: t("q.hint") }));
    main.append(h("div", { class: "row noprint" }, h("button", { type: "button", onclick: undoLast }, "← " + t("back"))));
    return heading;
  }

  function answer(attr, value) {
    s.answers[attr] = value;
    s.asked.push(attr);
    render(true);
  }

  function undoLast() {
    if (s.asked.length === 0) { wipe(); return; }
    const a = s.asked.pop();
    delete s.answers[a];
    SSMetrics.unfinish();
    s.screen = "question";
    render(true);
  }

  /* ---------- 4. results ---------- */
  function schemeCard(r) {
    const sc = r.scheme;
    const lines = whyLines(sc, r.status);
    const card = h("article", { class: "card" },
      h("div", { class: "card-head" }, SSIcons.icon(sc.id, "scheme"), h("h3", { text: I.pick(sc.name) })),
      h("p", null, h("span", { class: "badge " + r.status },
        h("span", { "aria-hidden": "true", text: r.status === E.ELIGIBLE ? "✓" : r.status === E.NOT_ELIGIBLE ? "✗" : "?" }),
        t("status." + r.status))),
      h("p", { text: I.pick(sc.benefit) }),
      h("p", { class: "hint", text: t("results.why") + ":" }),
      h("ul", { class: "why" }, lines.map((l) => h("li", { class: l.cls, text: l.text }))));
    if (r.status === E.NEEDS_A_QUICK_CHECK) {
      const labels = E.blockers(sc, s.answers).map(attrLabel).join(", ");
      card.append(h("p", { text: t("why.check", { list: labels }) }));
    }
    return card;
  }

  function renderResults(main) {
    SSMetrics.end();
    const heading = h("h2", { text: t("results.title") });
    main.append(heading, h("p", { class: "hint", text: t("results.intro") }));
    const all = E.results(s.cands, s.answers);
    const rank = { ELIGIBLE: 0, NEEDS_A_QUICK_CHECK: 1 };
    const active = all.filter((r) => r.status !== E.NOT_ELIGIBLE).sort((a, b) => rank[a.status] - rank[b.status]);
    const rejected = all.filter((r) => r.status === E.NOT_ELIGIBLE);
    const countOf = (st) => all.filter((r) => r.status === st).length;
    main.append(h("div", { class: "chips" }, [E.ELIGIBLE, E.NEEDS_A_QUICK_CHECK, E.NOT_ELIGIBLE].map((st) =>
      h("span", { class: "chip " + st }, h("strong", { text: String(countOf(st)) }), " " + t("status." + st)))));
    active.forEach((r) => main.append(schemeCard(r)));
    if (rejected.length) {
      main.append(h("details", null,
        h("summary", { text: t("results.notEligible", { n: rejected.length }) }),
        rejected.map(schemeCard)));
    }
    main.append(h("div", { class: "row noprint" },
      h("button", { type: "button", onclick: undoLast }, "← " + t("back")),
      h("button", { type: "button", class: "primary", onclick: () => go("docs") }, t("results.next")),
      h("button", { type: "button", onclick: () => wipe() }, t("results.restart"))));
    return heading;
  }

  /* ---------- 5. document checklist ---------- */
  function neededDocs() { return E.documentUnion(s.cands, s.answers); }
  function docById(id) { return SS_DOCS.find((d) => d.id === id); }
  function schemeNames(ids) {
    const names = ids.map((id) => I.pick(SS_SCHEMES.find((x) => x.id === id).name));
    return names.length > 3 ? names.slice(0, 3).join(", ") + " " + t("docs.more", { n: names.length - 3 }) : names.join(", ");
  }

  function renderDocs(main) {
    const heading = h("h2", { text: t("docs.title") });
    main.append(heading, h("p", { class: "hint", text: t("docs.intro") }));
    const list = neededDocs();
    if (!list.length) main.append(h("p", { text: t("docs.none") }));
    const haveCount = list.filter((d) => s.docs[d.id] === true).length;
    main.append(h("p", { id: "doc-progress-label", class: "qnum", text: t("docs.progress", { x: haveCount, y: list.length }) }),
      h("progress", { class: "progress", max: list.length, value: haveCount, "aria-labelledby": "doc-progress-label" }));
    list.forEach((d) => {
      const doc = docById(d.id);
      const state = s.docs[d.id];
      const set = (v) => { s.docs[d.id] = v; render(false, "doc-" + d.id + (v ? "-have" : "-miss")); };
      const card = h("article", { class: "card docrow" },
        h("div", { class: "card-head" }, SSIcons.icon(d.id, "doc"), h("h3", { text: I.pick(doc.name) })),
        h("p", { class: "hint", text: t("docs.for", { list: schemeNames(d.schemes) }) }),
        h("div", { class: "row" },
          h("button", { type: "button", id: "doc-" + d.id + "-have", "aria-pressed": String(state === true), onclick: () => set(true) }, t("docs.have")),
          h("button", { type: "button", id: "doc-" + d.id + "-miss", "aria-pressed": String(state === false), onclick: () => set(false) }, t("docs.donthave"))));
      if (state === false) {
        card.append(h("div", { class: "guide" }, h("strong", { text: t("docs.where") + ": " }), I.pick(doc.where)));
      }
      main.append(card);
    });
    main.append(h("div", { class: "row noprint" },
      h("button", { type: "button", onclick: () => go("results") }, "← " + t("back")),
      h("button", { type: "button", class: "primary", onclick: () => go("names") }, t("docs.next"))));
    return heading;
  }

  /* ---------- 6. mismatch pre-check ---------- */
  function renderNames(main) {
    const heading = h("h2", { text: t("names.title") });
    main.append(heading, h("p", { text: t("names.intro") }));
    NAME_KEYS.forEach((k) => {
      main.append(h("div", { class: "field" },
        h("label", { for: "name-" + k, text: t("names." + k) }),
        h("input", { type: "text", id: "name-" + k, value: s.names[k], autocomplete: "off", autocapitalize: "off", spellcheck: "false",
          oninput: (ev) => { s.names[k] = ev.target.value; } })));
    });
    main.append(h("div", { class: "row" }, h("button", { type: "button", class: "primary", onclick: checkNames }, t("names.check"))));

    const box = h("section", { id: "names-result", tabindex: "-1", "aria-live": "polite" });
    const r = s.nameResult;
    if (r) {
      if (r.filled < 2) box.append(h("p", { class: "error", text: t("names.need2") }));
      else {
        if (r.worst === "ok") box.append(h("p", null, h("span", { class: "badge ok", text: "✓ " + t("sev.ok") }), " " + t("names.allOk")));
        const involved = [];
        r.pairs.forEach((p) => {
          box.append(h("article", { class: "card" },
            h("p", null, h("span", { class: "badge " + p.severity, text: t("sev." + p.severity) }), " ",
              h("strong", { text: t("names.pair", { a: t("names." + p.a), b: t("names." + p.b) }) })),
            h("p", { text: t("class." + p.cls) }),
            p.crossScript ? h("p", { class: "hint", text: t("class.cross") }) : null));
          if (p.severity !== "ok") [p.a, p.b].forEach((k) => { if (involved.indexOf(k) < 0) involved.push(k); });
        });
        if (involved.length) {
          box.append(h("div", { class: "notice" },
            h("h3", { text: t("fix.title") }),
            h("ul", null, NAME_KEYS.filter((k) => involved.indexOf(k) >= 0).map((k) => h("li", { text: t("fix." + k) }))),
            h("p", { class: "hint", text: t("fix.hint") })));
        }
      }
    }
    main.append(box);
    main.append(h("div", { class: "row noprint" },
      h("button", { type: "button", onclick: () => go("docs") }, "← " + t("back")),
      h("button", { type: "button", class: "primary", onclick: () => go("summary") }, t("names.next"))));
    return heading;
  }

  function checkNames() {
    s.nameResult = M.checkRecords(NAME_KEYS.map((k) => ({ key: k, name: s.names[k] })));
    render(false, "names-result");
  }

  /* ---------- 7. summary ---------- */
  function summarySections() {
    const sections = [];
    sections.push({ title: t("summary.answers"), items: s.asked.map((a) => attrLabel(a) + ": " + answerText(a, s.answers[a])) });
    const res = E.results(s.cands, s.answers);
    const active = res.filter((r) => r.status !== E.NOT_ELIGIBLE);
    const items = active.map((r) => I.pick(r.scheme.name) + " – " + t("status." + r.status));
    if (res.length > active.length) items.push(t("summary.notEligibleCount", { n: res.length - active.length }));
    sections.push({ title: t("summary.matched"), items: items });
    const docs = neededDocs().map((d) => {
      const st = s.docs[d.id];
      return I.pick(docById(d.id).name) + " – " + (st === true ? t("summary.have") : st === false ? t("summary.missing") : t("summary.notChecked"));
    });
    sections.push({ title: t("summary.docs"), items: docs.length ? docs : [t("summary.none")] });
    const nr = s.nameResult;
    const nameItems = !nr || nr.filled < 2 ? [t("summary.notChecked")]
      : nr.pairs.map((p) => t("names.pair", { a: t("names." + p.a), b: t("names." + p.b) }) + " – " + t("sev." + p.severity) + ": " + t("class." + p.cls));
    sections.push({ title: t("summary.names"), items: nameItems });
    return sections;
  }

  function summaryText() {
    const out = [t("app.title") + " – " + t("summary.title"), t("summary.generated"), ""];
    summarySections().forEach((sec) => {
      out.push(sec.title);
      sec.items.forEach((i) => out.push("- " + i));
      out.push("");
    });
    out.push(t("summary.official"));
    return out.join("\n");
  }

  function copySummary() {
    const text = summaryText();
    const done = (ok) => { s.copyMsg = ok ? t("summary.copied") : t("summary.copyFail"); showToast(s.copyMsg); };
    const fallback = () => {
      const ta = h("textarea", { "aria-hidden": "true", style: "position:fixed;left:-999px" });
      ta.value = text;
      document.body.append(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      ta.remove();
      done(ok);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), fallback);
    else fallback();
  }

  function renderSummary(main) {
    const heading = h("h2", { text: t("summary.title") });
    main.append(heading);
    const art = h("article", { class: "summary" }, h("p", { class: "hint", text: t("summary.generated") }));
    summarySections().forEach((sec) => {
      art.append(h("section", null, h("h3", { text: sec.title }), h("ul", null, sec.items.map((i) => h("li", { text: i })))));
    });
    art.append(h("p", { class: "official", text: t("summary.official") }));
    main.append(art);
    main.append(h("div", { class: "row noprint" },
      h("button", { type: "button", onclick: copySummary }, t("summary.copy")),
      h("button", { type: "button", onclick: () => window.print() }, t("summary.print"))));
    main.append(h("div", { class: "row noprint" },
      h("button", { type: "button", onclick: () => go("names") }, "← " + t("back"))));
    return heading;
  }

  /* ---------- boot ---------- */
  render(false);
  resetIdle();
})();

</script>
<script>
/* If the external scripts could not be loaded (for example when the page is opened from a file manager on a phone), say so. */
window.addEventListener("load", function () {
  setTimeout(function () {
    var m = document.getElementById("main");
    if (m && !m.firstChild && !document.getElementById("boot-error")) {
      var d = document.createElement("div");
      d.id = "boot-error";
      d.setAttribute("role", "alert");
      d.style.cssText = "margin:12px;padding:12px;border:3px solid #7f1d1d;background:#fee2e2;color:#7f1d1d;font:16px/1.4 sans-serif;";
      d.textContent = "The app files did not load. Please open seva-sahayak-single.html instead (one file, works from a file manager), or serve this folder over http.";
      m.parentNode.insertBefore(d, m);
    }
  }, 1200);
});
</script>
